<div>
    <h4>Employee Details</h4>
    <p>Id is {{id}}, Name is {{name}} Salary is {{salary}} Active {{isActive}}</p>
    <input type="button" value="Update Salary using JS Event" onClick="updateSalary()"/>
    <input type="button" value="Update Salary using Angular Event" (click)="updateSalary()"/>

    <input type="button" value="add" (click)="addNumber(num1,num2)"/>
    <br/>
    {{result}}
</div>
