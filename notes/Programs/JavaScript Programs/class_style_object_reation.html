        // product class, property, constructor and methods 
        class Product {
            constructor(pid,pname,price){
                this.pid = pid;
                this.pname = pname;
                this.price = price;
            }
            discount(){
                // Implementation for discount logic
                this.price = this.price - (this.price * 0.1); // Apply 10% discount
            }
            display() {
                document.write("<br/> Product property inside a display in class style")
                document.write("<br/> Product ID : "+this.pid)
                document.write("<br/> Product Name : "+this.pname)
                document.write("<br/> Product Price : "+this.price)
            }
        }
        let p1 = new Product(100,"Mobile",20000);
        let p2 = new Product(101,"Laptop",50000);
        let p3 = new Product(102,"Tablet",30000);
        let products = [];      // array of the products. 
        products.push(p1);
        products.push(p2);
        products.push(p3);
        document.write("<br/> Product details before discount")
        products.forEach(p=>p.display());
        products.forEach(p=>p.discount());
        document.write("<br/> Product details after discount")
        products.forEach(p=>p.display());
    </script>
