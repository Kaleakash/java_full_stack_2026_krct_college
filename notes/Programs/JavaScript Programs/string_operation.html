<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/JavaScript">
        let msg = "Welcome to JavaScript Programming";
        document.write("<br/>"+msg);  
        document.write("<br/>"+msg.length);  // it display length of string
        document.write("<br/>"+msg.toUpperCase());  // it display string in upper case
        document.write("<br/>"+msg.toLowerCase());  // it display string in lower
        document.write("<br/>"+msg.charAt(0));  // it display first character of string
        document.write("<br/>"+msg.substring(0,7));  // it display substring
        
    </script>
</body>
</html>
