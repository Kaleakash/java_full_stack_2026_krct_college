<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/JavaScript">
        let day = "Monday";
        switch(day){
            case "Monday":
                console.log("Today is Monday");
                break;
            case "Tuesday":
                console.log("Today is Tuesday");
                break;
            default:
                console.log("Invalid day");
        }
    </script>
</body>
</html>
