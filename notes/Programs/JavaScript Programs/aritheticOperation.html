<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Arithmetic Operation Examples</h2>
    <script type="text/JavaScript">

        let num1 = 10;
        let num2 = 20;
        let sum = num1 + num2; // addition
        let sub = num1 - num2; // subtraction
        let mul = num1 * num2; // multiplication
        let div = num1 / num2; // division
        let mod = num1 % num2; // modulus
        document.write("Value of sum is "+sum);
        document.write("<br/> Value of sub is "+sub)
        document.write("<br/> Value of mul is "+mul)
        document.write("<br/> Value of div is "+div)
        document.write("<br/> Value of mod is "+mod)
    </script>
</body>
</html>
