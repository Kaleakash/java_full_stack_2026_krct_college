<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Data Types Examples</h2>
    <script type="text/JavaScript">
        let abc;
        let num=100;            // number data type
        let num1 = 100.10;      // number data type 
        let fname = "Raj Deep"; // string data type
        let result = true;          // boolean data type
        let result1 = false;         // boolean data type
        let result2 = null;          // null data type
        let obj = new Date();        // object data type
        document.write(abc);        // default value is undefined. 
        document.write("<br>");
        document.write("Value of num is "+num);
        document.write("<br/> Value of num1 is "+num1)
        document.write("<br/> Value of fname is "+fname)
        document.write("<br/> Value of result is "+result)
        document.write("<br/> Value of result1 is "+result1)
        document.write("<br/> Value of result2 is "+result2)
        document.write("<br/> Value of obj is "+obj)
    </script>
</body>
</html>
