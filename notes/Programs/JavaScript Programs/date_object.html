<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/JavaScript">
        let dd = new Date();
        document.write("<br/>"+dd);
        document.write("<br/>"+dd.getDate());  // it display date
        document.write("<br/>"+dd.getDay());  // it display day
        document.write("<br/>"+dd.getFullYear());  // it display year
        document.write("<br/>"+dd.getHours());  // it display hours
        document.write("<br/>"+dd.getMinutes());  // it display minutes
        document.write("<br/>"+dd.getSeconds());  // it display seconds
        document.write("<br/>"+dd.getMonth()); 
    </script>
</body>
</html>
