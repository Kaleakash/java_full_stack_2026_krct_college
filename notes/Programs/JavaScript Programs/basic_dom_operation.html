<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Welcome to Simple DOM Operation</h1>
    <h2 id="heading"></h2>
<input type="text" id ="fname" placeholder="Enter your fname"><br/>
<input type="text" id ="lname" placeholder="Enter your lname"><br/>
<input type="text" id="fullname" placeholder="full name"/><br/>

<input type="button" value="Click Here" id="btn1" onclick="domOperation()"/>
    <div id="result"></div>
    
    <script type="text/JavaScript">
        function domOperation() {
            // let h1TagValue = document.getElementsByTagName('h1')[0].innerHTML;
            // let h2TagReference = document.getElementById("heading");
            // h2TagReference.innerHTML = h1TagValue;
            
            let fname = document.getElementById("fname").value;
            let lname = document.getElementById("lname").value;
            let fullName = document.getElementById("fullname");
            fullName.value = fname+" "+lname;
            document.getElementById("fname").value=""
            document.getElementById("lname").value=""
            document.getElementById("result").innerHTML = fname+" "+lname;
        }
    </script>
</body>
</html>
